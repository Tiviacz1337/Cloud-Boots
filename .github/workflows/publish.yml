name: Publish on CurseForge & Modrinth

on:
  workflow_dispatch:
    inputs:
      loader:
        type: choice
        description: Mod loader
        options:
          - fabric
          - neoforge

env:
  MINECRAFT_VERSION: 1.21.8
  JAVA_VERSION: 21
  VERSION: 1.21.8-3.0.2
  RELEASE_NAME_CURSEFORGE: "cloudboots-${{ inputs.loader }}-1.21.8-3.0.2"
  RELEASE_NAME_MODRINTH: "[1.21.8] Cloud Boots 3.0.2"
  MODRINTH_TOKEN: ${{ secrets.MODRINTH }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew :${{ inputs.loader }}:clean :${{ inputs.loader }}:build

      - name: Publish (CurseForge/Modrinth)
        if: inputs.loader == 'fabric'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 631764
          modrinth-id: 1BGsoydA

          files: ${{ inputs.loader }}/build/libs/cloudboots-${{ inputs.loader }}-${{ env.VERSION }}.jar

          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"

          modrinth-name: ${{ env.RELEASE_NAME_MODRINTH }}
          curseforge-name: ${{ env.RELEASE_NAME_CURSEFORGE }}
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: ${{ inputs.loader }}/CHANGELOG.md

          loaders: ${{ inputs.loader }}
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            forge-config-api-port(required){modrinth:ohNO6lps}{curseforge:547434}

          java: "${{ env.JAVA_VERSION }}"

      - name: Publish (CurseForge/Modrinth)
        if: inputs.loader == 'neoforge'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 631764
          modrinth-id: 1BGsoydA

          files: ${{ inputs.loader }}/build/libs/cloudboots-${{ inputs.loader }}-${{ env.VERSION }}.jar

          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"

          modrinth-name: ${{ env.RELEASE_NAME_MODRINTH }}
          curseforge-name: ${{ env.RELEASE_NAME_CURSEFORGE }}
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: ${{ inputs.loader }}/CHANGELOG.md

          loaders: ${{ inputs.loader }}
          game-versions: "${{ env.MINECRAFT_VERSION }}"

          java: "${{ env.JAVA_VERSION }}"