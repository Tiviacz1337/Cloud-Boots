architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def commonGeneratedResources = project(':common').file("src/generated/resources")
def commonSharedResources = project(':common').file("src/main/resources")

sourceSets {
    main {
        resources {
            srcDir commonSharedResources
            srcDir commonGeneratedResources
        }
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
        outputDirectory = commonGeneratedResources
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    implementation("maven.modrinth:forge-config-api-port:rSd3GiG8")
    api 'com.electronwill.night-config:core:3.8.1'
    api 'com.electronwill.night-config:toml:3.8.1'

    //Optional
    implementation("maven.modrinth:trinkets-updated:r453A8nE")
    implementation("maven.modrinth:modmenu:njXb639R")

    //JEI
    implementation("maven.modrinth:jei:9WFjN08I")
}

processResources {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range_fabric  : minecraft_version_range_fabric,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_display_name                : mod_display_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description,
            mod_display_url                 : mod_display_url,
            mod_issue_tracker_url           : mod_issue_tracker_url,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

jar {
    archiveClassifier = "raw"
}

java {
    withSourcesJar()
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    from rootProject.file("LICENSE.md")
}

publishMods {
    displayName = "cloudboots-fabric-$rootProject.minecraft_version-$rootProject.mod_version"
    type = STABLE

    file = shadowJar.archiveFile

    def changelogFile = file('CHANGELOG.md')
    changelog = changelogFile.exists() ? changelogFile.text : 'CHANGELOG.md not found'

    modLoaders.add("fabric")

    curseforge {
        projectId = "291246"
        version = rootProject.mod_version
        accessToken = providers.gradleProperty('CURSEFORGE_TOKEN')
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true

        requires("fabric-api", "forge-config-api-port")
    }

    modrinth {
        projectId = "hkztOJro"
        version = minecraft_version + "-" + mod_version
        accessToken = providers.gradleProperty('MODRINTH_TOKEN')
        minecraftVersions.add(rootProject.minecraft_version)
        environment = CLIENT_AND_SERVER

        requires("fabric-api", "forge-config-api-port")
    }
}