plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def commonGeneratedResources = project(':common').file("src/generated/resources")
def commonSharedResources = project(':common').file("src/main/resources")

sourceSets {
    main {
        resources {
            srcDir commonSharedResources
            srcDir commonGeneratedResources
        }
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
        outputDirectory = commonGeneratedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("maven.modrinth:forge-config-api-port:YbUUjWdw")
    api 'com.electronwill.night-config:core:3.8.1'
    api 'com.electronwill.night-config:toml:3.8.1'

    //Optional
    modImplementation("maven.modrinth:modmenu:ku5NivOP")
    modImplementation("maven.modrinth:trinkets-canary:1MdtHaxo")
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:7.0.0-beta.1"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:7.0.0-beta.1"
    //modCompileOnly("maven.modrinth:jei:$rootProject.jei_version_fabric")
}

processResources {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range_fabric  : minecraft_version_range_fabric,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_display_name                : mod_display_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description,
            mod_display_url                 : mod_display_url,
            mod_issue_tracker_url           : mod_issue_tracker_url,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    displayName = "cloudboots-fabric-$rootProject.minecraft_version-$rootProject.mod_version"
    type = STABLE

    file = remapJar.archiveFile

    def changelogFile = file('CHANGELOG.md')
    changelog = changelogFile.exists() ? changelogFile.text : 'CHANGELOG.md not found'

    modLoaders.add("fabric")

    curseforge {
        projectId = "291246"
        version = rootProject.mod_version
        accessToken = providers.gradleProperty('CURSEFORGE_TOKEN')
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true

        requires("fabric-api", "forge-config-api-port")
    }

    modrinth {
        projectId = "hkztOJro"
        version = minecraft_version + "-" + mod_version
        accessToken = providers.gradleProperty('MODRINTH_TOKEN')
        minecraftVersions.add(rootProject.minecraft_version)
        environment = CLIENT_AND_SERVER

        requires("fabric-api", "forge-config-api-port")
    }
}